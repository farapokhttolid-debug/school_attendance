<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سیستم</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>سیستم حضور و غیاب</h1>
            <h2>ورود به سیستم</h2>

            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="form-group" id="schoolSelectGroup">
                    <label>انتخاب مدرسه</label>
                    <select name="school_id" id="school_id">
                        <option value="">-- در حال بارگذاری --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>نام کاربری (۴ رقم)</label>
                    <input type="text" name="username" id="username" maxlength="4" pattern="\d{4}" required autofocus>
                </div>

                <div class="form-group">
                    <label>رمز عبور (۴ رقم)</label>
                    <input type="password" name="password" maxlength="4" pattern="\d{4}" required>
                </div>

                <button type="submit" class="btn-login">ورود</button>
            </form>

            <div style="margin-top:15px; font-size:12px; color:#888;">
                مدیر کل سیستم: نام کاربری <b>1000</b>
            </div>
        </div>
    </div>

    <script>
        // لود مدارس
        async function loadSchools() {
            const sel = document.getElementById('school_id');
            try {
                const res = await fetch('/api/schools_list');
                const data = await res.json();

                if (data.success && data.schools.length) {
                    sel.innerHTML = '<option value="">-- انتخاب کنید --</option>';
                    data.schools.forEach(s => {
                        sel.innerHTML += `<option value="${s.id}">${s.name}</option>`;
                    });
                } else {
                    sel.innerHTML = '<option value="">هنوز مدرسه‌ای ثبت نشده</option>';
                }
            } catch (e) {
                console.error('خطا در لود مدارس:', e);
                sel.innerHTML = '<option value="">خطا در بارگذاری</option>';
            }
        }

        // اگه نام کاربری 1000 بود، انتخاب مدرسه رو مخفی کن
        document.getElementById('username').addEventListener('input', (e) => {
            const group = document.getElementById('schoolSelectGroup');
            if (e.target.value === '1000') {
                group.style.display = 'none';
            } else {
                group.style.display = 'block';
            }
        });

        // اجرا در بارگذاری صفحه
        window.addEventListener('DOMContentLoaded', loadSchools);
    </script>
</body>
</html>
